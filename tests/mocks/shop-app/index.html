<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen Home</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #222; }
    body { margin: 0; background: #faf8f5; }
    header { display: flex; align-items: center; gap: 24px; padding: 16px 32px; background: #fff; border-bottom: 1px solid #eee; }
    header .logo { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; color: #222; }
    header nav a { margin-right: 16px; color: #555; text-decoration: none; font-size: 15px; }
    header .cart { margin-left: auto; color: #222; text-decoration: none; }
    main { max-width: 960px; margin: 0 auto; padding: 32px; }
    h1 { font-size: 32px; letter-spacing: -0.02em; margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 24px; }
    .card { background: #fff; border-radius: 14px; padding: 18px; text-decoration: none; color: inherit; border: 1px solid #eee; display: block; }
    .card .img { height: 120px; border-radius: 10px; background: #efe9e1; margin-bottom: 12px; }
    .price { color: #666; }
    .btn { background: #1f6f5c; color: #fff; border: 0; border-radius: 999px; padding: 12px 22px; font-size: 16px; cursor: pointer; }
    .banner { background: #efe9e1; border-radius: 16px; padding: 28px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/" data-link>Lumen Home</a>
    <nav>
      <a href="/c/furniture" data-link>Furniture</a>
      <a href="/c/lighting" data-link>Lighting</a>
      <a href="/c/decor" data-link>Decor</a>
    </nav>
    <a class="cart" href="/cart" data-link id="cart-link">Cart (<span id="cart-count">0</span>)</a>
  </header>
  <main id="app"></main>
  <script>
    const products = {
      'aurora-desk-lamp': { name: 'Aurora desk lamp', price: 89, cat: 'lighting' },
      'nimbus-floor-lamp': { name: 'Nimbus floor lamp', price: 149, cat: 'lighting' },
      'halo-pendant': { name: 'Halo pendant light', price: 119, cat: 'lighting' },
      'oak-bookshelf': { name: 'Oak bookshelf', price: 249, cat: 'furniture' },
      'linen-armchair': { name: 'Linen armchair', price: 399, cat: 'furniture' },
      'ceramic-vase': { name: 'Ceramic vase', price: 39, cat: 'decor' },
    };
    let cart = [];
    const $ = (s) => document.querySelector(s);
    const title = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    function card(id) {
      const p = products[id];
      return `<a class="card" href="/p/${id}" data-link><div class="img"></div><strong>${p.name}</strong><div class="price">$${p.price}</div></a>`;
    }
    function render() {
      const path = location.pathname;
      const app = $('#app');
      $('#cart-count').textContent = cart.length;
      let m;
      if (path === '/' || path === '/index.html') {
        document.title = 'Lumen Home';
        app.innerHTML = `<div class="banner"><h1>Light up your home</h1><p>Considered furniture and lighting.</p></div>
          <div class="grid">${Object.keys(products).slice(0, 3).map((k) => card(k === 'aurora-desk-lamp' ? 'oak-bookshelf' : k)).join('')}</div>`;
      } else if ((m = path.match(/^\/c\/(\w+)/))) {
        document.title = title(m[1]) + ' – Lumen Home';
        const ids = Object.keys(products).filter((k) => products[k].cat === m[1]);
        app.innerHTML = `<h1>${title(m[1])}</h1><div class="grid">${ids.map(card).join('')}</div>`;
      } else if ((m = path.match(/^\/p\/([\w-]+)/)) && products[m[1]]) {
        const p = products[m[1]];
        document.title = p.name + ' – Lumen Home';
        app.innerHTML = `<div class="img" style="height:260px;border-radius:16px;background:#efe9e1"></div>
          <h1 style="margin-top:20px">${p.name}</h1><p class="price">$${p.price}</p>
          <button class="btn" id="add-to-cart" data-id="${m[1]}">Add to cart</button>`;
      } else if (path === '/cart') {
        document.title = 'Cart – Lumen Home';
        app.innerHTML = `<h1>Your cart</h1>${cart.length ? `<ul id="cart-items">${cart.map((id) => `<li>${products[id].name}</li>`).join('')}</ul>` : '<p>Your cart is empty.</p>'}
          <p><a href="/checkout" data-link id="checkout-link">Checkout</a></p>`;
      } else if (path === '/checkout') {
        // Deliberately glitchy controls for robustness tests (tests/e2e/participant-hardening.spec.ts).
        document.title = 'Checkout – Lumen Home';
        app.innerHTML = `<h1>Checkout</h1>
          <p class="price">Delivery in 3–5 days.</p>
          <div class="card" id="gift-wrap" style="cursor:pointer;display:inline-block">Add gift wrap</div>
          <p style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap">
            <button class="btn" id="apply-coupon">Apply coupon</button>
            <button class="btn" id="place-order">Place order</button>
            <button class="btn" id="track-order">Track order</button>
          </p>`;
      } else {
        app.innerHTML = '<h1>Page not found</h1>';
      }
    }
    function go(href) {
      history.pushState({}, '', href);
      render();
    }
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[data-link]');
      if (a) {
        e.preventDefault();
        go(a.getAttribute('href'));
        return;
      }
      if (e.target.closest('#apply-coupon')) {
        // Uncaught runtime error (the page stays usable).
        setTimeout(() => { const coupon = null; coupon.code.trim(); }, 0);
        return;
      }
      if (e.target.closest('#place-order')) {
        // Freeze: the main thread never yields again.
        for (;;) {}
      }
      if (e.target.closest('#track-order')) {
        // White screen: the app tears down its UI and throws (like an unhandled React render error).
        document.querySelector('header').remove();
        document.getElementById('app').remove();
        throw new Error("Cannot read properties of undefined (reading 'status')");
      }
      const add = e.target.closest('#add-to-cart');
      if (add) {
        cart.push(add.dataset.id);
        if (window.ThinkAloud && window.ThinkAloud.track) window.ThinkAloud.track('add_to_cart', { id: add.dataset.id });
        go('/cart');
      }
    });
    window.addEventListener('popstate', render);
    render();
  </script>
</body>
</html>
